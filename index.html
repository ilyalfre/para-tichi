<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi Tichi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa:#ff8fb1; --rosa-fuerte:#ff4d8d; --rosa-claro:#ffe4ee; --crema:#fff8f3;
    --texto:#6b2a45; --sombra:rgba(160,40,90,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Quicksand',sans-serif;color:var(--texto);
    background:radial-gradient(circle at 20% 10%,#ffd6e5 0,transparent 45%),
               radial-gradient(circle at 85% 90%,#ffe9d6 0,transparent 45%),
               linear-gradient(160deg,#fff0f5,#ffe1ec 60%,#fff3ea);
    background-attachment:fixed;overflow-x:hidden;
  }

  /* ---------- corazones flotantes ---------- */
  #cielo{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .flotante{position:absolute;bottom:-40px;animation:subir linear forwards;opacity:.85;user-select:none}
  @keyframes subir{
    0%{transform:translateY(0) translateX(0) rotate(0)}
    50%{transform:translateY(-55vh) translateX(var(--dx)) rotate(20deg)}
    100%{transform:translateY(-115vh) translateX(0) rotate(-10deg);opacity:0}
  }

  /* ---------- pantalla del sobre ---------- */
  #inicio{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:28px;padding:16px;
    transition:opacity .9s ease, visibility .9s;
  }
  #inicio.fuera{opacity:0;visibility:hidden}
  .pista{font-family:'Dancing Script',cursive;font-size:clamp(22px,5vw,32px);color:var(--rosa-fuerte);
    animation:latido 1.6s ease-in-out infinite}
  .sobre{position:relative;width:min(320px,80vw);aspect-ratio:3/2;cursor:pointer;
    filter:drop-shadow(0 18px 30px var(--sombra));animation:flotar 3s ease-in-out infinite}
  .sobre .cuerpo{position:absolute;inset:0;background:#ffc2d6;border-radius:10px}
  .sobre .solapa{position:absolute;left:0;right:0;top:0;height:60%;
    background:#ffadc8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;
    transition:transform .7s ease;z-index:3;border-radius:10px 10px 0 0}
  .sobre .frente{position:absolute;inset:0;background:#ffb8cf;
    clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:10px;z-index:2}
  .sobre .sello{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;
    font-size:44px;transition:opacity .3s}
  .sobre .cartita{position:absolute;left:8%;right:8%;top:12%;bottom:8%;background:var(--crema);
    border-radius:6px;z-index:1;transition:transform .8s ease .4s;display:flex;align-items:center;justify-content:center;
    font-family:'Dancing Script',cursive;color:var(--rosa-fuerte);font-size:22px}
  .sobre.abierto .solapa{transform:rotateX(180deg);z-index:0}
  .sobre.abierto .sello{opacity:0}
  .sobre.abierto .cartita{transform:translateY(-70%)}

  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}

  /* ---------- contenido ---------- */
  main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-block:48px 80px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    opacity:0;transition:opacity 1s ease .2s}
  main.visible{opacity:1}

  .portada{text-align:center;padding:24px 0 40px}
  .conejita{width:min(170px,42vw);margin:0 auto 6px;display:block;animation:saltito 2.4s ease-in-out infinite}
  @keyframes saltito{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-18px) rotate(-4deg)}40%{transform:translateY(0) rotate(0)}}
  .oreja-izq{transform-origin:70px 70px;animation:oreja 2.4s ease-in-out infinite}
  @keyframes oreja{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}}

  h1{font-family:'Dancing Script',cursive;font-weight:700;line-height:1.05;
    font-size:clamp(48px,12vw,104px);
    color:var(--rosa-fuerte)}
  h1 .letra{display:inline-block;opacity:0;transform:translateY(30px) scale(.6);
    animation:aparecer .6s cubic-bezier(.2,1.4,.4,1) forwards, brillo 2.6s ease-in-out infinite;
    text-shadow:0 4px 18px rgba(255,77,141,.35)}
  @keyframes aparecer{to{opacity:1;transform:none}}
  @keyframes brillo{50%{color:#ff8fb1;text-shadow:0 4px 26px rgba(255,143,177,.7)}}
  .subtitulo{font-family:'Dancing Script',cursive;font-size:clamp(28px,6.5vw,48px);color:var(--rosa-fuerte);
    margin-top:6px;opacity:0;animation:aparecer 1s ease forwards 1.8s}
  .corazon-grande{font-size:56px;display:inline-block;margin-top:14px;animation:latido 1.3s ease-in-out infinite}

  /* ---------- carta ---------- */
  .carta{background:var(--crema);border-radius:18px;padding:clamp(22px,5vw,42px);margin:20px auto 56px;
    max-width:680px;box-shadow:0 20px 50px var(--sombra);position:relative;
    background-image:repeating-linear-gradient(transparent 0 33px,#ffd9e6 33px 34px)}
  .carta::before{content:"💌";position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:42px}
  .carta p{font-size:clamp(17px,2.6vw,20px);line-height:34px;min-height:34px;white-space:pre-wrap}
  .cursor{display:inline-block;width:2px;height:1.1em;background:var(--rosa-fuerte);vertical-align:-3px;
    animation:parpadeo .8s steps(1) infinite}
  @keyframes parpadeo{50%{opacity:0}}
  .firma{font-family:'Dancing Script',cursive;font-size:30px;text-align:right;color:var(--rosa-fuerte);
    margin-top:14px;opacity:0;transition:opacity 1s}
  .firma.ver{opacity:1}

  /* ---------- fotos ---------- */
  h2{font-family:'Dancing Script',cursive;text-align:center;font-size:clamp(34px,7vw,52px);color:var(--rosa-fuerte);margin-bottom:28px}
  .galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px 26px;padding:0 6px}
  .polaroid{background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 12px 28px var(--sombra);
    transform:rotate(var(--r)) translateY(40px);opacity:.35;transition:transform .5s ease, opacity .8s ease, box-shadow .3s;
    cursor:pointer;position:relative}
  .polaroid.ver{transform:rotate(var(--r));opacity:1}
  .polaroid:hover{transform:rotate(0) scale(1.05);box-shadow:0 20px 40px rgba(160,40,90,.28);z-index:2}
  .polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);
    background:rgba(255,173,200,.7);border-radius:3px}
  .polaroid .marco{aspect-ratio:1;border-radius:3px;overflow:hidden;
    background:linear-gradient(135deg,#ffe4ee,#ffd0e0);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:6px;color:#e07aa0;font-size:14px;text-align:center}
  .polaroid .marco span{font-size:40px}
  .polaroid img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid figcaption{font-family:'Dancing Script',cursive;font-size:24px;text-align:center;margin-top:10px}

  /* ---------- final ---------- */
  .final{text-align:center;margin-top:70px}
  .boton{font-family:'Quicksand',sans-serif;font-weight:600;font-size:18px;color:#fff;border:0;cursor:pointer;
    background:linear-gradient(135deg,#ff6f9d,#ff4d8d);padding:14px 30px;border-radius:999px;
    box-shadow:0 10px 24px rgba(255,77,141,.35);transition:transform .2s}
  .boton:hover{transform:scale(1.06)}
  .boton:active{transform:scale(.96)}
  .contador{margin-top:14px;font-size:16px;min-height:22px}

  /* visor de foto */
  #visor{position:fixed;inset:0;z-index:20;background:rgba(80,20,45,.75);display:flex;align-items:center;justify-content:center;
    padding:16px;opacity:0;visibility:hidden;transition:.35s}
  #visor.abierto{opacity:1;visibility:visible}
  #visor img{max-width:100%;max-height:88vh;border-radius:10px;border:10px solid #fff;transform:scale(.9);transition:.35s}
  #visor.abierto img{transform:scale(1)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div id="cielo" aria-hidden="true"></div>

<!-- Sobre de entrada -->
<section id="inicio">
  <div class="pista">Tienes un mensajito… toca el sobre 💕</div>
  <div class="sobre" id="sobre" role="button" tabindex="0" aria-label="Abrir el sobre">
    <div class="cuerpo"></div>
    <div class="cartita">Para Tichi 🐰</div>
    <div class="frente"></div>
    <div class="solapa"></div>
    <div class="sello">💗</div>
  </div>
</section>

<main id="contenido">
  <section class="portada">
    <!-- conejita -->
    <svg class="conejita" viewBox="0 0 200 200" aria-hidden="true">
      <g class="oreja-izq">
        <ellipse cx="72" cy="48" rx="17" ry="44" fill="#fff" stroke="#f5b3c9" stroke-width="3"/>
        <ellipse cx="72" cy="50" rx="8" ry="32" fill="#ffc2d6"/>
      </g>
      <ellipse cx="128" cy="48" rx="17" ry="44" fill="#fff" stroke="#f5b3c9" stroke-width="3" transform="rotate(10 128 90)"/>
      <ellipse cx="128" cy="50" rx="8" ry="32" fill="#ffc2d6" transform="rotate(10 128 90)"/>
      <ellipse cx="100" cy="128" rx="62" ry="56" fill="#fff" stroke="#f5b3c9" stroke-width="3"/>
      <circle cx="78" cy="122" r="7" fill="#5a2a3d"/><circle cx="122" cy="122" r="7" fill="#5a2a3d"/>
      <circle cx="80" cy="119" r="2.4" fill="#fff"/><circle cx="124" cy="119" r="2.4" fill="#fff"/>
      <ellipse cx="66" cy="140" rx="10" ry="6" fill="#ffb3cb" opacity=".8"/>
      <ellipse cx="134" cy="140" rx="10" ry="6" fill="#ffb3cb" opacity=".8"/>
      <path d="M95 136 q5 5 10 0" fill="#ff8fb1"/>
      <path d="M100 141 q-6 8 -12 3 M100 141 q6 8 12 3" stroke="#5a2a3d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M140 76 c-6-10 -20-6 -14 6 l14 12 14-12 c6-12 -8-16 -14-6z" fill="#ff4d8d"/>
    </svg>
    <h1 id="titulo">Te amo</h1>
    <div class="subtitulo">Tichi, mi conejita 🐰</div>
    <div class="corazon-grande">💖</div>
  </section>

  <article class="carta">
    <p id="mensaje"></p>
    <div class="firma" id="firma">Con todo mi amor 💕</div>
  </article>

  <h2>Nosotros dos 📸</h2>
  <div class="galeria" id="galeria"></div>

  <section class="final">
    <h2>¿Me das un abrazo?</h2>
    <button class="boton" id="botonAmor">Mándame un besito 💋</button>
    <div class="contador" id="contador"></div>
  </section>
</main>

<div id="visor" aria-hidden="true"><img alt=""></div>

<script>
/* ====== EDITA AQUÍ ====== */
const MENSAJE = `Mi Tichi hermosa:

no estes mas tristeeeee mi amor mira te amo mucho corazoncita eres una conejita muy bonita no estes triste te adoro quiero verte ya mañana mi vida besos muchos besos muak muak preciosa te amo🐰💗`;

// Pon tus fotos en una carpeta "fotos" junto a este archivo con estos nombres
const FOTOS = [
  { src: "fotos/foto4.jpg", texto: "Siempre juntos 💖", pos: "center 30%" },
  { src: "fotos/foto1.webp", texto: "Abrazaditos 💕", pos: "center" },
  { src: "fotos/foto3.png", texto: "Zaya y Zaik 🐰🐰", pos: "center 60%" },
  { src: "fotos/foto5.jpg", texto: "Mi conejita preciosa", pos: "center" },
  { src: "fotos/foto2.webp", texto: "Perritos por videollamada 🐶", pos: "center 40%" },
  { src: "fotos/foto6.jpg", texto: "Tú y yo ✨", pos: "center 35%" },
];
/* ======================== */

const cielo = document.getElementById('cielo');
const emojis = ['💗','💕','💖','🌸','💞','🐰','✨','💓'];
function soltarCorazon(x, tam){
  const e = document.createElement('span');
  e.className = 'flotante';
  e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left = (x ?? Math.random()*100) + (x != null ? 'px' : 'vw');
  e.style.fontSize = (tam || 14 + Math.random()*22) + 'px';
  e.style.setProperty('--dx', (Math.random()*80-40) + 'px');
  e.style.animationDuration = (6 + Math.random()*6) + 's';
  cielo.appendChild(e);
  setTimeout(() => e.remove(), 13000);
}
setInterval(() => soltarCorazon(), 550);

// Explosión de corazones desde un punto
function explosion(cx, cy, n = 24){
  for (let i = 0; i < n; i++){
    const e = document.createElement('span');
    e.textContent = emojis[i % emojis.length];
    const ang = Math.random()*Math.PI*2, dist = 80 + Math.random()*160;
    Object.assign(e.style,{position:'fixed',left:cx+'px',top:cy+'px',fontSize:(16+Math.random()*18)+'px',
      zIndex:30,pointerEvents:'none',transition:'transform 1.1s cubic-bezier(.1,.8,.3,1), opacity 1.1s'});
    document.body.appendChild(e);
    requestAnimationFrame(() => {
      e.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(1.2)`;
      e.style.opacity = '0';
    });
    setTimeout(() => e.remove(), 1200);
  }
}

// Abrir sobre
const sobre = document.getElementById('sobre');
let abierto = false;
function abrir(){
  if (abierto) return; abierto = true;
  sobre.classList.add('abierto');
  const r = sobre.getBoundingClientRect();
  explosion(r.left + r.width/2, r.top + r.height/2, 30);
  setTimeout(() => {
    document.getElementById('inicio').classList.add('fuera');
    document.getElementById('contenido').classList.add('visible');
    animarTitulo();
    setTimeout(escribir, 2400);
  }, 1300);
}
sobre.addEventListener('click', abrir);
sobre.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });

// Título letra por letra
function animarTitulo(){
  const h = document.getElementById('titulo');
  const txt = h.textContent; h.textContent = '';
  [...txt].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = 'letra';
    s.innerHTML = c === ' ' ? '&nbsp;' : c;
    s.style.animationDelay = (0.15 * i) + 's';
    h.appendChild(s);
  });
}

// Máquina de escribir
function escribir(){
  const p = document.getElementById('mensaje');
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  let i = 0;
  const chars = [...MENSAJE];
  (function paso(){
    if (i < chars.length){
      p.textContent = chars.slice(0, ++i).join('');
      p.appendChild(cursor);
      const c = chars[i-1];
      setTimeout(paso, c === '\n' ? 280 : (',.'.includes(c) ? 180 : 38));
    } else {
      cursor.remove();
      document.getElementById('firma').classList.add('ver');
    }
  })();
}

// Galería
const galeria = document.getElementById('galeria');
FOTOS.forEach((f, i) => {
  const fig = document.createElement('figure');
  fig.className = 'polaroid';
  fig.style.setProperty('--r', ((i % 2 ? 1 : -1) * (2 + Math.random()*4)) + 'deg');
  const marco = document.createElement('div'); marco.className = 'marco';
  const img = new Image();
  img.alt = f.texto;
  if (f.pos) img.style.objectPosition = f.pos;
  img.onload = () => { marco.innerHTML = ''; marco.appendChild(img); fig.dataset.src = f.src; };
  img.onerror = () => { marco.innerHTML = '<span>🐰</span>Aquí va una foto<br>de nosotros 💕'; };
  img.src = f.src;
  const cap = document.createElement('figcaption'); cap.textContent = f.texto;
  fig.append(marco, cap);
  fig.addEventListener('click', e => {
    explosion(e.clientX, e.clientY, 12);
    if (fig.dataset.src){
      visor.querySelector('img').src = fig.dataset.src;
      visor.classList.add('abierto');
    }
  });
  galeria.appendChild(fig);
});
const visor = document.getElementById('visor');
visor.addEventListener('click', () => visor.classList.remove('abierto'));

// Aparecer polaroids al hacer scroll
const obs = new IntersectionObserver(entradas => {
  entradas.forEach(en => {
    if (en.isIntersecting){
      const idx = [...galeria.children].indexOf(en.target);
      setTimeout(() => en.target.classList.add('ver'), (idx % 3) * 150);
      obs.unobserve(en.target);
    }
  });
}, { threshold: .2 });
[...galeria.children].forEach(el => obs.observe(el));

// Botón de besitos
let besos = 0;
const frases = ['¡Recibido! 😚','Otro más 💋','Me encantas 💕','Eres mi conejita 🐰','Te amo infinito ♾️💖','Más besitos 😍'];
document.getElementById('botonAmor').addEventListener('click', e => {
  besos++;
  explosion(e.clientX, e.clientY, 28);
  for (let k = 0; k < 6; k++) setTimeout(() => soltarCorazon(e.clientX + (Math.random()*80-40), 30), k*80);
  document.getElementById('contador').textContent =
    `${frases[(besos-1) % frases.length]} · ${besos} ${besos === 1 ? 'besito' : 'besitos'}`;
});
</script>

</body>
</html>
